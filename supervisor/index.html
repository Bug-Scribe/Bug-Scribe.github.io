<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Supervisor | BugScribe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>
<body>
    <nav class="site-nav">
        <div class="container nav-inner">
            <a class="nav-brand" href="/about/">BugScribe</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-menu">Menu</button>
            <ul class="nav-menu" id="primary-menu">
                <li><a href="/about/">About</a></li>
                <li><a href="/speed-up/">Speed Up Bug Reporting</a></li>
                <li><a href="/research/">ROI Microsite</a></li>
                <li><a href="/references/">Our Research</a></li>
                <li><a href="/team/">Team</a></li>
                <li><a href="/supervisor/" class="active">Supervisor</a></li>
                <li><a href="/project-info/">Project Info</a></li>
                <li><a href="/links/">Links</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <div class="container">
            <section id="supervisor">
                <h2>Project Supervisor</h2>
                <div class="supervisor-card">
                    <div class="supervisor-name">Eray Tüzün</div>
                    <div class="supervisor-title">Faculty Supervisor</div>
                    <div class="supervisor-links">
                        <a href="https://eraytuzun.com/" target="_blank" aria-label="Eray Tüzün-Personal Website">
                            <i class="fas fa-globe"></i>
                        </a>
                        <a href="https://www.linkedin.com/in/tuzuneray/" target="_blank" aria-label="Eray Tüzün-LinkedIn Profile">
                            <i class="fab fa-linkedin"></i>
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 BugScribe Team - Bilkent University Computer Engineering Department</p>
            <p>CS-491 Senior Design Project</p>
        </div>
    </footer>
    <script>
        const navToggle = document.querySelector('.nav-toggle');
        const navMenu = document.querySelector('.nav-menu');

        if (navToggle && navMenu) {
            navToggle.addEventListener('click', () => {
                const isOpen = navMenu.classList.toggle('is-open');
                navToggle.setAttribute('aria-expanded', String(isOpen));
                navToggle.textContent = isOpen ? 'Close' : 'Menu';
            });

            navMenu.querySelectorAll('a').forEach((link) => {
                link.addEventListener('click', () => {
                    navMenu.classList.remove('is-open');
                    navToggle.setAttribute('aria-expanded', 'false');
                    navToggle.textContent = 'Menu';
                });
            });
        }
    </script>
</body>
</html>
